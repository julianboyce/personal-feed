<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0e1116">
<title>My Feed — Curated discoveries</title><meta name="description" content="A personal feed of discoveries about hiking, travel, AI and the NFL.">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0e1116;color:#edf0f5}header{position:sticky;top:0;background:#0e1116ee;backdrop-filter:blur(16px);border-bottom:1px solid #272e38;z-index:3}.wrap{max-width:780px;margin:auto;padding:0 20px}.head{display:flex;justify-content:space-between;align-items:center;padding:23px 0}.brand{font-size:23px;font-weight:850;letter-spacing:-.7px}.brand span{color:#8de2ad}.eyebrow{color:#a0aab9;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.intro{padding:38px 0 24px}.intro h1{font-size:clamp(29px,5vw,45px);line-height:1.1;letter-spacing:-1.5px;margin:8px 0 12px}.intro p{color:#aeb7c3;margin:0;line-height:1.6}.tabs{display:flex;gap:9px;overflow:auto;padding:4px 0 25px;scrollbar-width:none}.tab{background:#1b222b;color:#c7d0da;border:1px solid #333c49;border-radius:50px;padding:10px 16px;white-space:nowrap;cursor:pointer;font-weight:650}.tab.active{background:#d3f7dd;color:#123021;border-color:#d3f7dd}.tab:focus-visible,.card:focus-visible{outline:2px solid #a8ebc0;outline-offset:3px}.count{color:#aeb7c3;font-size:13px;padding-bottom:16px}.card{display:block;color:inherit;text-decoration:none;background:#171d25;border:1px solid #303846;border-radius:19px;padding:23px;margin-bottom:16px;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:#7ea993}.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:#b2bcc8}.pill{border-radius:20px;padding:5px 10px;background:#2a3a37;color:#b5edc9;font-weight:750}.card h2{font-size:clamp(20px,3.2vw,26px);letter-spacing:-.6px;line-height:1.3;margin:16px 0 9px}.card p{font-size:15px;line-height:1.7;color:#b4beca;margin:0 0 20px}.bottom{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#b3c5bb}.open{color:#a8ebc0;font-weight:750}.empty{padding:40px;text-align:center;color:#aeb7c3}.foot{padding:30px 0 50px;color:#818c9a;font-size:12px;text-align:center}@media(max-width:500px){.card{padding:19px}.intro{padding-top:29px}}
</style></head><body>
<header><div class="wrap head"><div class="brand">my<span>feed.</span></div><div class="eyebrow">Curated for curiosity</div></div></header>
<main class="wrap"><section class="intro"><div class="eyebrow">A personal corner of the internet</div><h1>Worth your attention.</h1><p>Interesting things to read, watch, and explore — without the noise.</p></section><nav class="tabs" id="tabs" aria-label="Filter categories"></nav><div class="count" id="count">Loading stories…</div><section id="feed" aria-live="polite"></section></main>
<footer class="wrap foot">Curated discoveries · Links lead to original publishers</footer>
<script>
const API='https://hcacxbmiyiaokmkkcwkc.supabase.co/rest/v1/feed_items?select=title,url,source,summary,content_type,category,published_at,created_at&is_published=eq.true&order=created_at.desc&limit=100';
// Supabase publishable key; safe in a public website with RLS enabled.
const KEY='sb_publishable_geGgW9fIh7PRtj5lUt9QrQ_enISDuFV';
let items=[],selected='All';const tabs=document.getElementById('tabs'),feed=document.getElementById('feed'),count=document.getElementById('count');
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function render(){tabs.replaceChildren();for(const c of ['All',...new Set(items.map(i=>i.category).filter(Boolean))]){const b=el('button','tab'+(c===selected?' active':''),c==='Hiking Chiang Mai'?'Chiang Mai hiking':c);b.type='button';b.setAttribute('aria-pressed',String(c===selected));b.onclick=()=>{selected=c;render()};tabs.append(b)}feed.replaceChildren();const shown=items.filter(i=>selected==='All'||i.category===selected);count.textContent=shown.length+' '+(shown.length===1?'story':'stories')+(selected==='All'?'':' in '+selected);if(!shown.length){feed.append(el('div','empty','Nothing here yet. Check back soon.'));return}for(const i of shown){const a=el('a','card');a.href=i.url;a.target='_blank';a.rel='noopener noreferrer';const m=el('div','meta');m.append(el('span','pill',i.category||'General'),el('span','',i.source||'Source'));if(i.published_at){const d=new Date(i.published_at);if(!Number.isNaN(+d))m.append(el('span','',d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})))}a.append(m,el('h2','',i.title),el('p','',i.summary||''));const bot=el('div','bottom');bot.append(el('span','',i.content_type==='video'?'Video':i.content_type==='social_post'?'Social post':'Article'),el('span','open','Read original ↗'));a.append(bot);feed.append(a)}}
fetch(API,{headers:{apikey:KEY}}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{items=x;render()}).catch(e=>{console.error(e);count.textContent='';feed.replaceChildren(el('div','empty','Unable to load the feed. Please refresh.'))});
</script></body></html>
